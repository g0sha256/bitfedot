[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitfedot"
version = "0.3.1"
description = "A complete, private, hardened Bitcoin node for Fedora"
keywords = ["bitcoin", "fedora", "tor", "electrum", "mempool", "node", "gtk"]
readme = "README.md"
license = { text = "Unlicense" }
authors = [{ name = "G0SHA256" }]
requires-python = ">=3.12"

[project.gui-scripts]
bitfedot = "bitfedot.app:main"

[tool.setuptools]
packages = ["bitfedot", "bitfedot.ui"]

[tool.setuptools.package-data]
bitfedot = ["data/**/*", "keys/**/*"]

[project.urls]
Homepage = "https://github.com/G0SHA256/bitfedot"
Issues = "https://github.com/G0SHA256/bitfedot/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Real errors only (syntax, undefined names, unused imports); style is left to review.
select = ["E9", "F"]
